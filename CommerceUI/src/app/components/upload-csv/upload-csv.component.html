<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-header bg-primary text-white py-3">
        <h5 class="card-title mb-0 fw-bold">
          <i class="bi bi-cloud-upload me-2"></i> Carga Masiva de Archivos CSV
        </h5>
      </div>
      <div class="card-body p-4">
        <p class="text-muted">
          Seleccione el archivo <code>.csv</code> con la información de los comercios para registrar los datos en el sistema.
        </p>

        <div class="mb-4">
          <label class="form-label fw-bold">Archivo CSV</label>
          <input 
            type="file" 
            class="form-control form-control-lg" 
            accept=".csv" 
            (change)="onFileSelected($event)">
        </div>

        <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center">
          <i class="bi bi-check-circle-fill me-2 fs-5"></i>
          <div>{{ successMessage }}</div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center">
          <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
          <div>{{ errorMessage }}</div>
        </div>

        <button 
          class="btn btn-primary btn-lg w-100 fw-bold" 
          [disabled]="!selectedFile || loading" 
          (click)="onUpload()">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Procesando archivo...' : 'Subir Archivo' }}
        </button>
      </div>
    </div>
  </div>
</div>
